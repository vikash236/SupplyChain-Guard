[workspace]
members = [
    "crates/scanner",
    "crates/sandbox",
    "crates/policy",
    "crates/cargo-guard",
    "crates/audit",
    "crates/integrity",
    "crates/sbom",
]
resolver = "2"

[package]
name = "supplychain-guard"
version = "0.1.0"
edition = "2021"
description = "Build-time sandbox and static analyzer for supply chain build scripts"
license = "MIT"

[dependencies]
scanner = { path = "crates/scanner" }
sandbox = { path = "crates/sandbox" }
policy = { path = "crates/policy" }
audit = { path = "crates/audit" }
integrity = { path = "crates/integrity" }
sbom = { path = "crates/sbom" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "2"

