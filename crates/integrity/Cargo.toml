[package]
name = "integrity"
version = "0.1.0"
edition = "2021"
description = "Workspace file system integrity snapshotting and mutation verification engine for SupplyChain-Guard"
license = "MIT"

[dependencies]
walkdir = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"

[dev-dependencies]
tempfile = "3"
