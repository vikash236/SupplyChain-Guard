[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"
description = "OS-native process sandbox for build script isolation"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "sched", "mount"] }
libc = "0.2"
