[package]
name = "scanner"
version = "0.1.0"
edition = "2021"
description = "Static AST scanner for build.rs and package.json build scripts"

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
policy = { path = "../policy" }

[dev-dependencies]
tempfile = "3"




